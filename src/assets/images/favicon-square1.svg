      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="textGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
