<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20"
        fill="url(#modernTech)"
        filter="drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1))"/>
  
  <!-- Subtle circuit-like pattern -->
  <path d="M20 50 h15 v-15 h15" stroke="#60a5fa" stroke-opacity="0.1" stroke-width="1" fill="none"/>
  <path d="M80 50 h-15 v15 h-15" stroke="#60a5fa" stroke-opacity="0.1" stroke-width="1" fill="none"/>
  
  <!-- Modern text with custom dot placement -->
  <text x="50" y="58" 
        font-family="'JetBrains Mono', monospace" 
        font-size="24" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#ffffff"
        letter-spacing="0">
    <tspan>M</tspan>
    <tspan dx="-1" fill="#60a5fa">·</tspan>
    <tspan dx="-1">LaB</tspan>
  </text>
</svg>