<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="subtleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20"
        fill="url(#subtleGradient)"
        filter="drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1))"/>
  
  <!-- Modern minimalist text -->
  <text x="50" y="58" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="26" 
        font-weight="500" 
        text-anchor="middle" 
        fill="url(#accentGradient)"
        letter-spacing="0.5">
    M·LaB
  </text>
</svg>