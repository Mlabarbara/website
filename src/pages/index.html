<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark LaBarbara - Cybersecurity Professional</title>
    
    <!-- Immediate theme initialization -->
    <script>
        const prefersDark = localStorage.theme === 'dark' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', prefersDark);
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/favicon-modern2.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="nav-container"></div>

    <!-- Rest of the body content remains the same -->
    
    <script type="module">
        async function initializePage() {
            try {
                console.log('Initializing page...');
                
                // Load navigation
                const response = await fetch('../components/nav/nav.html');
                const html = await response.text();
                document.getElementById('nav-container').innerHTML = html;
                
                // Wait for DOM to update
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Import and initialize main module
                const mainModule = await import('../js/main.js');
                console.log('Main module loaded');
                
                // Additional error checking
                const nav = document.querySelector('nav');
                if (!nav) {
                    console.error('Navigation not found after initialization');
                }
                
                const mobileMenu = document.querySelector('[data-mobile-menu]');
                if (!mobileMenu) {
                    console.error('Mobile menu not found after initialization');
                }
            } catch (error) {
                console.error('Error initializing page:', error);
            }
        }
        
        // Initialize as soon as DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }
    </script>
</body>
</html>
