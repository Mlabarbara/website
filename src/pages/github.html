<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Repositories - Mark LaBarbara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/favicon-modern2.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <!-- Intro Section -->
        <section class="content-card p-8 animate-fade-in hover-float mb-12">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">My GitHub Repositories</h2>
            <p class="text-gray-600 dark:text-gray-300 leading-relaxed mb-4">
                Here are my public repositories fetched directly from the GitHub API. Click on any repository to visit it on GitHub.
            </p>    
        </section>

        <!-- Repo List Section -->
        <section class="content-card p-8 animate-fade-in hover-float">
            <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-4">Repositories</h3>
            <div id="repo-list" class="space-y-4">
                <!-- Repositories will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <script type="module" src="../js/main.js"></script>
    <script type="module">
        fetch('../components/nav/nav.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('nav-container').innerHTML = html;
            });

        // Fetch and display repos
        async function fetchAndDisplayRepos() {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '<p class="text-gray-600 dark:text-gray-300">Loading repositories...</p>';

            try {
                const response = await fetch('https://api.github.com/users/Mlabarbara/repos');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const repos = await response.json();

                if (repos.length === 0) {
                    repoList.innerHTML = '<p class="text-gray-600 dark:text-gray-300">No repositories found.</p>';
                    return;
                }

                // Clear loading text
                repoList.innerHTML = '';

                // Create elements for each repo
                repos.forEach(repo => {
                    const repoCard = document.createElement('div');
                    repoCard.className = 'p-4 rounded-lg shadow hover:floating-card bg-white dark:bg-gray-800 transition-all';

                    const title = document.createElement('h4');
                    title.className = 'text-lg font-semibold text-blue-700 dark:text-blue-400 mb-2';
                    title.innerText = repo.name;

                    const description = document.createElement('p');
                    description.className = 'text-gray-700 dark:text-gray-300 mb-2';
                    description.innerText = repo.description ? repo.description : 'No description provided.';

                    const link = document.createElement('a');
                    link.href = repo.html_url;
                    link.className = 'text-blue-500 hover:text-blue-300 dark:text-blue-300';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.innerText = 'View on GitHub';

                    repoCard.appendChild(title);
                    repoCard.appendChild(description);
                    repoCard.appendChild(link);
                    repoList.appendChild(repoCard);
                });
            } catch (error) {
                console.error('Error fetching repos:', error);
                repoList.innerHTML = '<p class="text-red-500 dark:text-red-400">Error loading repositories. Please try again later.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAndDisplayRepos);
    </script>
</body>
</html>
