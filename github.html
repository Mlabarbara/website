<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/mainout.css">
</head>
<body class="bg-gray-50 dark:bg-black transition-colors duration-200">
    <!-- Navigation uses nav-header and .dark to have a blue gradient in light and dark custom zinz in dark -->
    <nav class="nav-header dark:nav-header shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="nav-link text-white hover:text-blue-200 font-bold text-xl">M.LaB</a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="nav-link text-white hover:text-blue-200">Home</a>
                    <a href="blog.html" class="nav-link text-white hover:text-blue-200">Blog</a>
                    <!-- <a href="projects.html" class="nav-link text-white hover:text-blue-200">Projects</a>-->
                    <a href="contact.html" class="nav-link text-white hover:text-blue-200">Contact</a>
                    <a href="github.html" class="nav-link text-white hover:text-blue-200">GitHub</a>
                    <a href="template.html" class="nav-link text-white hover:text-blue-200">Template</a>
                    <button id="theme-toggle" type="button" title="theme-toggle" class="p-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg">
                        <!-- Sun icon -->
                        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <!-- Moon icon -->
                        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center space-x-4">
                    <button id="theme-toggle-mobile" type="button" title="theme-toggle-mobile" class="p-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">
                        <!-- Sun icon -->
                        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <!-- Moon icon -->
                        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <button id="mobile-menu-button" type="button" title="mobile-menu-button" class="text-white hover:bg-blue-800 dark:hover:bg-gray-700 p-2 rounded-lg transition-colors duration-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden pb-4">
                <a href="index.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">Home</a>
                <a href="blog.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">Blog</a>
                <!-- <a href="projects.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">Projects</a>-->
                <a href="contact.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">Contact</a>
                <a href="github.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200">GitHub</a>

            </div>
        </div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <!-- Intro Section -->
        <section class="profile-section rounded-xl p-8 animate-fade-in hover-float mb-12">
            <h2 class="text-2xl font-bold text-white dark:text-gray-100 mb-4">My GitHub Repositories</h2>
            <p class="text-white dark:text-gray-300 leading-relaxed mb-4">
                Here are my public repositories fetched directly from the GitHub API. Click on any repository to visit it on GitHub.
            </p>    
        </section>

        <!-- Repo List Section -->
        <section class="content-card dark:bg-zinc-900 p-8 animate-fade-in hover-float">
            <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-4">Repositories</h3>
            <div id="repo-list" class="space-y-4">
                <!-- Repositories will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/github.js"></script>
</body>
</html>
