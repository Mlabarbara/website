<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Scaffolding - Mark LaBarbara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Navigation -->
    <nav class="bg-blue-900 dark:bg-gray-800 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-white text-xl font-bold">M.LaB</span>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="nav-link text-white hover:text-blue-200">Home</a>
                    <a href="projects.html" class="nav-link text-white hover:text-blue-200">Projects</a>
                    <a href="contact.html" class="nav-link text-white hover:text-blue-200">Contact</a>
                    <button id="theme-toggle" class="p-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg">
                        <!-- Sun icon -->
                        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <!-- Moon icon -->
                        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden flex items-center space-x-4">
                    <button id="mobile-menu-button">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden pb-4">
                <a href="index.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg">Home</a>
                <a href="projects.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg">Projects</a>
                <a href="contact.html" class="block px-4 py-2 text-white hover:bg-blue-800 dark:hover:bg-gray-700 rounded-lg">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <!-- Projects Header Section -->
        <section class="profile-section rounded-xl p-8 text-white mb-12 animate-fade-in hover-float">
            <div class="flex flex-col md:flex-row items-center gap-8">
                <div class="text-center md:text-left">
                    <h1 class="text-4xl font-bold mb-4">Projects</h1>
                    <h2 class="text-xl font-semibold mb-4">Network Security Implementation</h2>
                    <!-- Rest of your content -->
                </div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
